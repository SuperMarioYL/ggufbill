<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="ggufbill architecture: GGUF model -> ggufbill emit -> .ggufbill.json manifest -> reproduce / 等保 audit">
  <defs>
    <marker id="ah-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#1D1D1F"/>
  <g stroke="#3A3A44" stroke-width="1.5" fill="none">
    <line x1="190" y1="180" x2="230" y2="180" marker-end="url(#ah-d)"/>
    <line x1="405" y1="180" x2="445" y2="180" marker-end="url(#ah-d)"/>
    <line x1="620" y1="180" x2="660" y2="180" marker-end="url(#ah-d)"/>
  </g>
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="190" y1="180" x2="226" y2="180" stroke="#4DA3FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="405" y1="180" x2="441" y2="180" stroke="#8985FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.55s" repeatCount="indefinite"/>
    </line>
    <line x1="620" y1="180" x2="656" y2="180" stroke="#2DC79A" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.1s" repeatCount="indefinite"/>
    </line>
  </g>
  <g>
    <circle r="3" fill="#4DA3FF">
      <animateMotion path="M190,180 L226,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#8985FF">
      <animateMotion path="M405,180 L441,180" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#2DC79A">
      <animateMotion path="M620,180 L656,180" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.6s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g>
    <rect x="15" y="140" width="175" height="80" rx="15" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="102" y="175" text-anchor="middle" font-size="15" font-weight="600" fill="#4DA3FF">GGUF model</text>
    <text x="102" y="194" text-anchor="middle" font-size="11" font-weight="400" fill="#A1A1A8">.gguf file</text>
    <rect x="230" y="140" width="175" height="80" rx="15" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-1.1s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="317" y="175" text-anchor="middle" font-size="15" font-weight="600" fill="#8985FF">ggufbill</text>
    <text x="317" y="194" text-anchor="middle" font-size="11" font-weight="400" fill="#A1A1A8">emit · inspect · audit</text>
    <rect x="445" y="140" width="175" height="80" rx="15" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-2.2s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="532" y="175" text-anchor="middle" font-size="15" font-weight="600" fill="#2DC79A">.ggufbill.json</text>
    <text x="532" y="194" text-anchor="middle" font-size="11" font-weight="400" fill="#A1A1A8">deployment manifest</text>
    <rect x="660" y="140" width="205" height="80" rx="15" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.16;0.24;0.16" keyTimes="0;0.5;1" dur="3.2s" begin="-0.5s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="762" y="175" text-anchor="middle" font-size="15" font-weight="600" fill="#4DA3FF">Reproduce &amp; Audit</text>
    <text x="762" y="194" text-anchor="middle" font-size="11" font-weight="400" fill="#A1A1A8">llama-server / 等保 report</text>
  </g>
</svg>
